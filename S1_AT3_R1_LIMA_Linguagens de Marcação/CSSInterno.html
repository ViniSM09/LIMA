<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CSSInterno</title>
    <!-- Declaração do CSS Interno -->
    <style>
        H1 {
            color: rgb(0, 0, 0);
            text-align: center;
            font-size: 72px;
        }
        P {
            color: rgb(0, 0, 0);
            text-align: left;
            font-size: 40px;
        }
        H2 {
            color: rgb(red, green, blue);
            text-align: left;
            font-size: 40px;
        }
    </style>

</head>

<body>
    <h1>Vinícius dos Santos Mendes</h1>
    <br>
    <p>Estudante de Desenvolvimento de Sistemas</p>
    <br>
    <hr>
    <br>
    <h1 style="text-align: center;">Lista de Cursos</h1>
    <br>
    <h2>Lista de Cursos Transversais</h2>
</body>

</html>
